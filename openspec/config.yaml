schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Tech stack: Vite + React + TypeScript + Tailwind CSS + shadcn/ui (frontend only).
  Realtime: Supabase Realtime (broadcast + presence) over the anon/publishable key; no custom server.
  Pings are ephemeral (no persistence, no Postgres writes) for the MVP.
  No authentication; identity is a client-generated UUID plus an optional nickname.
  Hosting: Vercel (free). Secrets/config via Vite `VITE_` env vars.
  Domain: a cute "ping your friend, see their pong" realtime app.

